# Optional one-click backend deploy on Render.com
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gestion-cours-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-cours-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: gestion-cours-db
    plan: free
