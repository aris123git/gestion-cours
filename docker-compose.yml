services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-desktop-admin-sync-key-change-me}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost,http://127.0.0.1:5173
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - backend
